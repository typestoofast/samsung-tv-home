<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Four</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <nav class="destinations" aria-label="Your shortcuts">
      <button class="destination apple" data-key="apple" data-kind="hdmi" aria-label="Apple TV" tabindex="0"><img src="assets/appletv.svg" alt="" width="240" height="240"></button>
      <button class="destination switch" data-key="switch" data-kind="hdmi" aria-label="Nintendo Switch 2" tabindex="-1"><img src="assets/nintendoswitch.svg" alt="" width="240" height="240"></button>
      <button class="destination stremio" data-key="stremio" data-kind="app" data-app-id="IkWsFHtOY9.Stremio" aria-label="Stremio" tabindex="-1"><img src="assets/stremio.svg" alt="" width="240" height="240"></button>
      <button class="destination steam" data-key="steam" data-kind="hdmi" aria-label="Steam" tabindex="-1"><img src="assets/steam.svg" alt="" width="240" height="240"></button>
    </nav>
    <footer>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="samsung" tabindex="-1">Samsung Home</button>
    </footer>
  </main>
  <script src="input-map.js"></script>
  <script src="device.js"></script>
  <script src="app.js"></script>
</body>
</html>
